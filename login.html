<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Acceso ❤️</title>
<style>
.login{max-width:340px;margin:0 auto;text-align:center}
.login p{text-align:center;margin-bottom:8px}
.dots{display:flex;gap:14px;justify-content:center;margin:20px 0 24px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--rosa);transition:.15s}
.dot.on{background:var(--rosa)}
.dots.error{animation:shake .4s}
.dots.error .dot{border-color:#c0392b;background:#c0392b}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{font:inherit;font-size:1.5rem;font-weight:600;height:64px;border-radius:50%;border:0;background:var(--rosa-suave);color:var(--vino);cursor:pointer;touch-action:manipulation;transition:transform .1s,background .2s}
.pad button:active{transform:scale(.92);background:#f6bfd0}
.pad .vacio{visibility:hidden}
#msg{min-height:1.4em;margin-top:18px;font-size:.95rem;color:#c0392b}
</style>
</head>
<body>
<div id="hearts"></div>
<div class="container centro">
  <div class="card login">
    <h1>Para ti ❤️</h1>
    <p>Ingresa el PIN para continuar</p>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="pad" id="pad"></div>
    <div id="msg" role="alert"></div>
  </div>
</div>
 
<script>
/* PIN guardado como hash SHA-256 (no en texto). Para cambiarlo ver instrucciones. */
const SALT = "71ebb5b60a0157d7e09aa6e5";
const PIN_HASH = "0690d90bf13dc7f16fcafdf0a5940904b0bb82e56eb96a79cbef31a04d657893";
const PIN_LENGTH = 4;
const MAX_INTENTOS = 5, BLOQUEO_SEG = 30;
 
const dots = document.getElementById("dots"), pad = document.getElementById("pad"), msg = document.getElementById("msg");
let pin = "", bloqueado = false;
 
for (let i = 0; i < PIN_LENGTH; i++) dots.innerHTML += '<span class="dot"></span>';
[1,2,3,4,5,6,7,8,9,"",0,"⌫"].forEach(k => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = k;
  if (k === "") b.className = "vacio";
  else b.addEventListener("click", () => tecla(String(k)));
  pad.appendChild(b);
});
 
function pintar(){ [...dots.children].forEach((d,i) => d.classList.toggle("on", i < pin.length)); }
 
async function sha256(t){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(SALT + t));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
}
 
async function tecla(k){
  if (bloqueado) return;
  if (k === "⌫") pin = pin.slice(0,-1);
  else if (pin.length < PIN_LENGTH) pin += k;
  pintar(); msg.textContent = "";
  if (pin.length === PIN_LENGTH) await verificar();
}
 
async function verificar(){
  let ok = false;
  try { ok = (await sha256(pin)) === PIN_HASH; }
  catch { msg.textContent = "Abre la página con https para continuar."; pin = ""; pintar(); return; }
 
  if (ok){
    sessionStorage.setItem("acceso","ok");
    localStorage.removeItem("intentos");
    location.replace("index.html");
    return;
  }
  const n = (+localStorage.getItem("intentos") || 0) + 1;
  localStorage.setItem("intentos", n);
  dots.classList.add("error");
  setTimeout(() => { dots.classList.remove("error"); pin = ""; pintar(); }, 450);
  if (n >= MAX_INTENTOS) bloquear(); else msg.textContent = "PIN incorrecto. Intenta de nuevo.";
}
 
function bloquear(){
  bloqueado = true;
  localStorage.setItem("hasta", Date.now() + BLOQUEO_SEG*1000);
  cuenta();
}
function cuenta(){
  const t = setInterval(() => {
    const resta = Math.ceil((+localStorage.getItem("hasta") - Date.now())/1000);
    if (resta <= 0){ clearInterval(t); bloqueado = false; localStorage.removeItem("intentos"); localStorage.removeItem("hasta"); msg.textContent = ""; }
    else msg.textContent = "Demasiados intentos. Espera " + resta + " s.";
  }, 500);
}
if (+localStorage.getItem("hasta") > Date.now()){ bloqueado = true; cuenta(); }
 
document.addEventListener("keydown", e => {
  if (/^\d$/.test(e.key)) tecla(e.key);
  else if (e.key === "Backspace") tecla("⌫");
});
</script>
<script src="script.js"></script>
</body>
</html>
